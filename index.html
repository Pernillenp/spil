<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GF1 Quest 5.1</title><style>body{font-family:Arial;margin:0;background:linear-gradient(135deg,#06b6d4,#7c3aed,#ec4899);color:#fff;text-align:center}.card{max-width:900px;margin:20px auto;padding:20px;background:rgba(255,255,255,.12);border-radius:20px}button{padding:12px 20px;margin:6px;border:none;border-radius:12px}#game{position:relative;height:500px;background:#111;border-radius:20px;overflow:hidden}.obj{position:absolute;font-size:36px}#rocket{position:absolute;bottom:10px;font-size:56px}</style></head><body><div id="app"></div><script>const app=document.getElementById('app');const icons={it:'💻',byg:'🔨',metal:'⚙️',mad:'🍔',style:'💄'};const bad=['👻','🍌','🗑️','🐌','👾'];const qs=[{q:'Hvad lyder sjovest?',a:[['Kode en app','it'],['Bygge noget','byg'],['Motor','metal'],['Mad','mad'],['Style','style']]},{q:'Hvad vælger du?',a:[['Computer','it'],['Værktøj','byg'],['Motor','metal'],['Kokkekniv','mad'],['Makeup','style']]},{q:'Hvilket projekt?',a:[['Website','it'],['Shelter','byg'],['Racerbil','metal'],['Foodtruck','mad'],['Modeshow','style']]}];let name='',step=0,player=45,score=0,timeLeft=15,winner='it';let scores={it:0,byg:0,metal:0,mad:0,style:0};let objects=[],frame,timer;function start(){app.innerHTML='<div class=card><h1>🎮 GF1 Quest 5.1</h1><input id=nm placeholder="Dit navn"><br><br><button id=s>Start</button></div>';document.getElementById('s').onclick=()=>{name=document.getElementById('nm').value||'Anonym';question();};}function question(){const q=qs[step];app.innerHTML='<div class=card><h2>'+q.q+'</h2></div>';const c=app.querySelector('.card');q.a.forEach(([t,v])=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>answer(v);c.appendChild(b);});}function answer(v){scores[v]++;if(step<qs.length-1){step++;question();}else{winner=Object.keys(scores).sort((a,b)=>scores[b]-scores[a])[0];game();}}function makeObj(){return{x:Math.random()*90,y:-Math.random()*100,good:Math.random()>.4,icon:null};}function game(){score=0;timeLeft=15;objects=Array.from({length:5},()=>{let o=makeObj();o.icon=o.good?icons[winner]:bad[Math.floor(Math.random()*bad.length)];return o;});app.innerHTML='<div class=card><h2 id=hud></h2><div id=game></div><button id=l>◀</button><button id=r>▶</button></div>';l.onclick=()=>player=Math.max(0,player-8);r.onclick=()=>player=Math.min(90,player+8);document.onkeydown=e=>{if(e.key==='ArrowLeft')player=Math.max(0,player-8);if(e.key==='ArrowRight')player=Math.min(90,player+8)};timer=setInterval(()=>{timeLeft--;if(timeLeft<=0)end();},1000);loop();}function loop(){const g=document.getElementById('game');const h=document.getElementById('hud');if(!g)return;objects.forEach(o=>{o.y+=0.8;if(o.y>84&&o.y<92&&Math.abs(o.x-player)<7){score+=o.good?10:-5;let n=makeObj();n.icon=n.good?icons[winner]:bad[Math.floor(Math.random()*bad.length)];Object.assign(o,n);}else if(o.y>105){let n=makeObj();n.icon=n.good?icons[winner]:bad[Math.floor(Math.random()*bad.length)];Object.assign(o,n);}});h.textContent='🏆 '+score+' | ⏱️ '+timeLeft;g.innerHTML=objects.map(o=>'<div class=obj style="left:'+o.x+'%;top:'+o.y+'%">'+o.icon+'</div>').join('')+'<div id=rocket style="left:'+player+'%">🚀</div>';frame=requestAnimationFrame(loop);}function end(){clearInterval(timer);cancelAnimationFrame(frame);app.innerHTML='<div class=card><h1>🏆 Resultat</h1><h2>'+icons[winner]+' '+winner+'</h2><h3>'+name+'</h3><h2>Score: '+score+'</h2><button onclick="location.reload()">🔄 PRØV IGEN</button></div>';}start();</script></body></html>
